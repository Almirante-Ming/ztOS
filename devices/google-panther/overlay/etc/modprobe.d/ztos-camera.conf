# the boot has settled, and stops trying after a start that hung
# (kernel/panther/gs201-panther-camera.dtsi, devices/google-panther/layer.sh)
blacklist gpio_s2mpg13
blacklist slg51002_regulator
blacklist imx386
blacklist s5kgn1
blacklist ak7375
blacklist phy_gs201_mipi_dcphy_rx
blacklist gs201_csis
