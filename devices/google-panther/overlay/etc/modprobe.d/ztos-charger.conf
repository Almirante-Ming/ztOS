# The MAX77759 charger on the Pixel 7 (as omarchy-mobile's cheetah,
# omamobile-charger.conf, USB-C-PLAN gate D1). No Type-C driver yet
# (tcpci_maxim would take over the USB port we use for SSH), so:
# - default_ilim_ua: charge at once at a 500 mA input limit, the bootloader's
#   own CHGIN_ILIM (0x13); without it the driver turns charging off;
# - temp_guard: stock's step-charging bands (0-55 C) from the gauge's
#   temperature and voltage, every 30 s;
# - keep_wcin: leave the wireless input on and report it as a source
#   (kernel/panther/patches/0005).
# The gauge loads first, so the guard's first reading succeeds.
options max77759_charger default_ilim_ua=500000 temp_guard=1 keep_wcin=1
softdep max77759_charger pre: max17042_battery
blacklist tcpci_maxim
blacklist gpio_max77759
blacklist nvmem_max77759
