# ztOSIAL manifest: Google Pixel 7 (panther), Tensor G2 (gs201), on mainline
# Linux (omarchy-mobile's kernel with ztOS's board file, kernel/panther/).
# Generic backends everywhere. Not there yet, and so hidden by ztOS: the
# charger (only the fuel gauge is driven), cpufreq (ACPM DVFS), thermal
# zones, haptics, the modem. The AoC's sensors are iio-sensor-proxy's D-Bus API (omamobile-sensors),
# not IIO devices.

[device]
codename = "google-panther"
name = "Google Pixel 7"
form_factor = "phone"
scale = 3.0

[gsi]
min = "0.2.0"

[ial.Display1]
backend = "generic"
node = "/sys/class/backlight/1c2c0000.dsi.0"

# The MAX77759 fuel gauge (kernel/panther/gs201-panther.dts). No charger
# supply: the gauge's own current tells charging from draining.
[ial.Power1]
backend = "generic"
battery = "/sys/class/power_supply/max170xx_battery"
current_sign = 1                 # max170xx: + charging, - draining, as ztOSIAL
current_node = "/sys/class/power_supply/max170xx_battery/current_now"
charger = "/sys/class/power_supply/max77759-charger"   # online/status: USB (CHGIN) or wireless (WCIN)

[ial.Perf1]
backend = "generic"
gpu_devfreq = "/sys/class/devfreq/28000000.gpu"
# no cpufreq and no zrn-hotplug: every core stays online
keep_online = [0, 1, 2, 3, 4, 5, 6, 7]
hotplug = false

[ial.Android1]
backend = "generic"

[android]
binder = "binderfs"
gralloc = "gbm"
memory_budget_mb = 2048

[boot]
usb_gadget_udc = "11210000.usb"
