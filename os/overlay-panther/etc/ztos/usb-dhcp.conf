# dnsmasq on the USB link: the computer gets 172.16.42.2, and no router and
# no DNS, so it never routes anything through the phone.
port=0
interface=usb0
bind-interfaces
dhcp-range=172.16.42.2,172.16.42.2,255.255.255.0,1h
dhcp-option=option:router
dhcp-option=option:dns-server
dhcp-leasefile=/run/ztos-usb-dhcp.leases
